<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高招人才库｜管理看板</title>
<style>/* 高招人才库 · 基础布局 */
:root { --mono: ui-monospace, monospace; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.7 var(--sans); }
::selection { background: var(--red); color: #fff7ea; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px; }

/* ---------- 面板 ---------- */
.panel { background: var(--paper-2); border: 1px solid var(--line); padding: 20px; margin-bottom: 16px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.panel-head h3 { margin: 0; font-size: 14.5px; font-family: var(--serif); }
.panel-head p { margin: 3px 0 0; color: var(--muted); font-size: 11.5px; }
.grid-2 { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-2 > .panel, .grid-3 > .panel { margin-bottom: 0; }
.grid-2, .grid-3 { margin-bottom: 16px; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.kpi { background: var(--paper-2); border: 1px solid var(--line); border-top: 2px solid var(--red); padding: 16px 18px; }
.kpi label { font-size: 11px; color: var(--muted); }
.kpi b { display: block; font-family: var(--serif); font-size: 30px; font-weight: 700; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.kpi b i { font-style: normal; font-size: 13px; color: var(--muted); margin-left: 3px; }
.kpi small { font-size: 10.5px; color: var(--muted); }

/* ---------- 条形图 ---------- */
.bar-item { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 10px; margin: 9px 0; font-size: 12px; }
.bar-item span { color: var(--ink-2); }
.bar-item em { font-style: normal; font-family: var(--mono); font-size: 12px; text-align: right; color: var(--ink-2); }
.track { height: 9px; background: var(--paper-3); }
.fill { height: 100%; background: var(--red); min-width: 2px; }
.fill.gold { background: var(--gold); }
.fill.moss { background: var(--moss); }
.metric { margin: 12px 0; }
.metric .m-line { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
.metric .m-line b { font-family: var(--mono); font-weight: 500; }
.callout { margin-top: 14px; padding: 10px 13px; background: var(--gold-soft); border-left: 3px solid var(--gold); font-size: 11.5px; color: var(--ink-2); line-height: 1.8; }

/* ---------- 表格 ---------- */
.tbl-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 500; letter-spacing: 0.05em; border-bottom: 1px solid var(--line-strong); padding: 8px 10px; white-space: nowrap; }
.tbl td { border-bottom: 1px solid var(--line); padding: 10px; vertical-align: top; }
.tbl tr:hover td { background: var(--gold-soft); }
.tbl .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.person-name { font-weight: 600; }
.muted { color: var(--muted); font-size: 11px; }

/* ---------- 徽章 ---------- */
.badge { display: inline-block; font-size: 10.5px; padding: 2px 9px; border: 1px solid var(--line-strong); color: var(--ink-2); background: var(--paper-2); white-space: nowrap; }
.badge.red { color: var(--red); border-color: rgba(176, 35, 44, 0.4); background: var(--red-soft); }
.badge.gold { color: var(--gold); border-color: rgba(168, 128, 42, 0.4); background: var(--gold-soft); }
.badge.moss { color: var(--moss); border-color: rgba(133, 116, 73, 0.4); }

/* ---------- 行条目（事件/任务/互动/审计） ---------- */
.row-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
.row-item:last-child { border-bottom: 0; }
.row-item b { font-size: 13px; display: block; }
.row-item small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; line-height: 1.7; }
.row-actions { display: flex; gap: 6px; flex: none; align-items: center; }
.mini-btn { border: 1px solid var(--line-strong); background: var(--paper-2); color: var(--ink-2); font-size: 11px; padding: 4px 10px; white-space: nowrap; }
.mini-btn:hover { border-color: var(--red); color: var(--red); }
.mini-btn.is-primary { background: var(--red); border-color: var(--red); color: #fff7ea; }
.mini-btn.is-primary:hover { opacity: 0.88; color: #fff7ea; }
.empty { padding: 22px 0; text-align: center; color: var(--muted); font-size: 12px; }

/* ---------- 事件卡 ---------- */
.event { display: grid; grid-template-columns: 108px 1fr auto; gap: 16px; padding: 15px 2px; border-bottom: 1px solid var(--line); }
.event:last-child { border-bottom: 0; }
.event-date { font-size: 10.5px; color: var(--muted); }
.event-date b { display: block; font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin: 2px 0 8px; }
.event h4 { margin: 0 0 4px; font-size: 13.5px; }
.event p { margin: 0; font-size: 12px; color: var(--ink-2); line-height: 1.8; }
.event p.src { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
.event-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }

/* ---------- 筛选条 ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.input, .select { border: 1px solid var(--line-strong); background: var(--paper-2); padding: 7px 11px; font-size: 12.5px; outline: none; }
.input:focus, .select:focus { border-color: var(--red); }
.input.search { flex: 1; min-width: 200px; }

/* ---------- 时间线 ---------- */
.timeline { border-left: 2px solid var(--line-strong); margin-left: 6px; padding-left: 18px; }
.tl-item { position: relative; padding: 0 0 16px; }
.tl-item::before { content: ""; position: absolute; left: -24px; top: 6px; width: 9px; height: 9px; background: var(--red); border: 2px solid var(--paper-2); border-radius: 50%; }
.tl-item:last-child { padding-bottom: 2px; }
.tl-item b { font-size: 13px; display: block; }
.tl-item small { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
.tl-item .row-actions { margin-top: 5px; }

/* ---------- 弹窗 ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(43, 36, 26, 0.45); display: none; place-items: center; z-index: 90; padding: 22px; overflow-y: auto; }
.modal-back.show { display: grid; }
.modal { background: var(--paper-2); border: 1px solid var(--line); border-top: 3px solid var(--red); width: 100%; max-width: 620px; max-height: 88vh; overflow-y: auto; padding: 26px 28px; }
.modal.wide { max-width: 760px; }
.modal h3 { margin: 0 0 4px; font-family: var(--serif); font-size: 17px; }
.modal .desc { margin: 0 0 18px; color: var(--muted); font-size: 12px; line-height: 1.8; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
.field input, .field select, .field textarea { border: 1px solid var(--line-strong); background: var(--paper); padding: 8px 11px; font-size: 13px; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--red); }
.field textarea { min-height: 74px; resize: vertical; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.detail-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.avatar { width: 46px; height: 46px; background: var(--red); color: #fff7ea; display: grid; place-items: center; font-family: var(--serif); font-size: 19px; font-weight: 700; flex: none; }
.detail-head h3 { margin: 0; }
.detail-head p { margin: 2px 0 6px; color: var(--muted); font-size: 12px; }
.detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
.detail-box { background: var(--gold-soft); border: 1px solid var(--line); padding: 9px 12px; }
.detail-box small { display: block; color: var(--muted); font-size: 10px; }
.detail-box b { font-size: 12.5px; }
.sec-title { font-size: 13px; font-family: var(--serif); margin: 18px 0 10px; display: flex; justify-content: space-between; align-items: center; }

/* ---------- 提示 ---------- */
.toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff7ea; font-size: 12.5px; padding: 10px 20px; opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 99; max-width: 80vw; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 页脚 ---------- */
.footer { border-top: 1px solid var(--line); margin-top: 30px; padding: 20px 0 40px; color: var(--muted); font-size: 11px; line-height: 1.9; }
.footer .wrap { display: flex; justify-content: space-between; gap: 24px; }
.footer-note { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-align: right; white-space: nowrap; }

/* ---------- 响应式 ---------- */
@media (max-width: 1080px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .event { grid-template-columns: 1fr; }
  .event-actions { flex-direction: row; }
  .form-grid { grid-template-columns: 1fr; }
  .top-meta { display: none; }
}

/* ---------- 打印 ---------- */
@media print {
  body { background: #fff; }
  .topbar, .tabs, .toolbar, .filters, .row-actions, .event-actions, .modal-back, .toast, .no-print { display: none !important; }
  .panel, .kpi { border-color: #ccc; box-shadow: none; break-inside: avoid; }
  .pagehead { padding-top: 0; }
  .tb-btn, .mini-btn { display: none; }
}

:root {
  --paper: #f7f6f3;
  --paper-2: #fff;
  --paper-3: #eceae7;
  --ink: #232a34;
  --ink-2: #3c4755;
  --muted: #5e646f;
  --line: #e5e1db;
  --line-strong: #cec9c2;
  --red: #324663;
  --red-soft: #edf1f6;
  --gold: #83551f;
  --gold-soft: #faf2e8;
  --moss: #425775;
  --serif: "Workbench Display", "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}
body { line-height: 1.7; }
::selection { background: var(--red); color: #fff; }
:focus-visible { outline: 2px solid #627da4; outline-offset: 3px; }
.wrap { max-width: 1080px; padding-inline: clamp(18px, 4vw, 46px); }
.masthead { background: #fff; border-top: 4px solid #334763; border-bottom: 1px solid var(--line); }
.masthead-in { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 20px; padding-block: 14px 11px; }
.brand-name { font-family: var(--serif); color: var(--ink); font-size: 23px; font-weight: 700; letter-spacing: .025em; line-height: 1.3; overflow-wrap: anywhere; }
.brand-sub { margin-top: 3px; font-size: 11px; line-height: 1.45; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.toolbar-menu { position: relative; }
.toolbar-menu summary { display: block; cursor: pointer; list-style: none; }
.toolbar-menu summary::-webkit-details-marker { display: none; }
.toolbar-menu summary::after { content: " ▾"; }
.toolbar-menu-items {
  display: grid; gap: 3px; position: absolute; top: calc(100% + 7px); right: 0; z-index: 15;
  min-width: 150px; padding: 6px; border: 1px solid var(--line); border-radius: 7px;
  background: #fff; box-shadow: 0 9px 28px #232a341a;
}
.toolbar-menu-items button { text-align: left; border-color: transparent; }
.tabs { border-top: 1px solid #f1eeea; }
.tabs-in { display: flex; overflow-x: auto; gap: clamp(9px, 2vw, 24px); }
.tab {
  flex: none; display: flex; align-items: center; gap: 4px; padding: 10px 1px 8px;
  border: 0; border-bottom: 2px solid transparent; background: none;
  color: var(--ink-2); white-space: nowrap; font-size: 13px;
}
.tab:hover, .tab.is-on { color: var(--red); }
.tab.is-on { border-bottom-color: var(--red); font-weight: 750; }
.tab .n { font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--red-soft); color: var(--red); }

.pagehead { padding: clamp(25px, 4vw, 38px) 0 17px; }
.pagehead h1 {
  margin: 0; color: var(--ink); font-family: var(--serif); font-weight: 700;
  font-size: clamp(30px, 4.5vw, 46px); letter-spacing: .017em; line-height: 1.25;
}
.pagehead .sub { margin: 7px 0 0; color: var(--muted); font-size: 13px; }
.scope {
  display: inline-block; margin-top: 9px; padding: 1px 8px; background: #f0ede8;
  color: #54514b; border: 1px solid #e7e2da; border-radius: 4px; font-size: 11px;
}

.grid-2, .grid-3, .dashboard-grid, .wb-columns, .case-grid, .kpis {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 13px; margin-bottom: 15px;
}
.dashboard-grid > .panel, .wb-columns > .panel { margin-bottom: 0; }
.hr-member-grid, .detail-grid, .form-grid { grid-template-columns: minmax(0, 1fr) !important; }

.panel, .kpi, .case-card { min-width: 0; background: #fff; border: 1px solid var(--line); border-radius: 9px; }
.panel { padding: clamp(15px, 2.6vw, 24px); margin-bottom: 15px; }
.panel-head { align-items: center; margin-bottom: 13px; }
.panel-head h3, .sec-title {
  color: var(--ink); font-family: var(--serif); font-size: clamp(18px, 2.25vw, 22px);
  font-weight: 700; line-height: 1.4;
}
.panel-head p { margin-top: 5px; font-size: 12px; line-height: 1.5; }
.tb-btn, .mini-btn {
  border: 1px solid var(--line-strong); border-radius: 5px; background: #fff; color: var(--ink-2);
  padding: 5px 10px; font-size: 12px; font-weight: 640;
}
.tb-btn:hover, .mini-btn:hover { border-color: #8b9bb0; color: var(--red); }
.tb-btn.is-primary, .mini-btn.is-primary { background: var(--red); border-color: var(--red); color: #fff; }
.tb-btn.is-primary:hover, .mini-btn.is-primary:hover { background: #233855; color: #fff; }
.badge { border-radius: 4px; background: #f4f3f0; font-weight: 650; }
.badge.red { color: #863a4a; border-color: #ebd1d7; background: #fbf0f3; }
.badge.gold { color: #805021; border-color: #ead8c2; background: #fbf2e8; }
.badge.moss { color: #415778; border-color: #d8e0ea; background: #eef2f6; }
.callout { background: #f4f2ee; border-left-color: #c3b4a0; border-radius: 0 5px 5px 0; }
.tbl { font-size: 13px; }
.tbl th, .tbl tr:hover td { background: #f7f6f3; }
.tbl th { font-weight: 650; }
.person-name { font-weight: 730; }
.event { grid-template-columns: minmax(0, 1fr); gap: 6px; }
.event-date { display: flex; align-items: center; gap: 7px; }
.event-date b { margin: 0; }
.event-actions { flex-flow: row wrap; align-items: start; }
.row-item, .event { overflow-wrap: anywhere; }
.input, .select, .field input, .field select, .field textarea { border-radius: 5px; min-width: 0; }
.modal-back { background: #202a385d; }
.modal { border-radius: 10px; border-top-color: var(--red); padding: clamp(16px, 3vw, 26px); }
.modal h3 { font-size: 22px; font-weight: 700; }
.sec-title { font-size: 17px; }
.detail-box, .hr-stat { background: #f5f4f1; border-radius: 5px; }
.avatar, .hr-avatar { border-radius: 6px; background: var(--red-soft); color: var(--red); }
.hr-avatar { width: 36px; height: 36px; display: grid; place-items: center; font-weight: 750; }
.hr-member { border: 1px solid var(--line); border-radius: 6px; padding: 14px; min-width: 0; }
.hr-stat { padding: 7px; }
.hr-chip { display: inline-block; font-size: 11px; color: var(--red); background: var(--red-soft); border-radius: 4px; padding: 2px 8px; }

/* 首页与汇总 */
.wb-context { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.wb-context label { color: var(--ink-2); font-weight: 650; font-size: 13px; }
.wb-context select { min-width: 105px; }
.wb-print-owner { display: none; }
.wb-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.wb-item:last-child { border-bottom: 0; }
.wb-item strong { display: block; line-height: 1.4; font-size: 13px; overflow-wrap: anywhere; }
.wb-item small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
.wb-item.wb-event { grid-template-columns: minmax(0, 1fr) auto; }
.wb-action { display: flex; align-items: center; justify-content: flex-end; gap: 5px; flex-wrap: wrap; }
.wb-action .mini-btn { padding: 3px 7px; font-size: 11px; }
.wb-later { margin-top: 7px; }
.wb-later summary { cursor: pointer; color: var(--ink-2); font-size: 12px; font-weight: 650; padding: 4px 0; }
.wb-people td { vertical-align: middle; }
.wb-people td:first-child { min-width: 150px; }
.wb-people th:not(:first-child) { min-width: 84px; }
.wb-people td > .wb-action { justify-content: flex-start; }
#iNextField[hidden] { display: none; }

.kpis { gap: 0; border: 1px solid var(--line); border-radius: 9px; background: #fff; overflow: hidden; }
.kpi {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 10px;
  padding: 9px 16px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; text-align: left;
}
.kpi:last-child { border-bottom: 0; }
.kpi label { font-size: 13px; color: var(--ink-2); font-weight: 650; }
.kpi b { grid-column: 2; grid-row: 1 / span 2; margin: 0; font-size: 27px; line-height: 1.15; color: var(--red); }
.kpi small { grid-column: 1; line-height: 1.55; }
.kpis-home > button:hover { background: #f5f7fa; }
.kpis-home > button:focus-visible { outline-offset: -3px; }
.kpi-heading { display: flex; align-items: center; gap: 6px; }
.kpi-arrow { color: var(--muted); font-size: 13px; }
.asset-chart { display: grid; justify-items: center; gap: 11px; margin-bottom: 6px; }
.asset-breakdown { width: min(100%, 380px); }
.asset-ring { width: 127px; aspect-ratio: 1; display: grid; place-items: center; position: relative; border-radius: 50%; background: var(--paper-3); isolation: isolate; }
.asset-ring::before { position: absolute; content: ""; inset: 15px; border-radius: 50%; background: #fff; z-index: -1; }
.asset-ring div { text-align: center; color: var(--muted); font-size: 11px; line-height: 1.25; }
.asset-ring b { display: block; margin-bottom: 3px; color: var(--ink); font-size: 29px; font-family: var(--serif); font-variant-numeric: tabular-nums; }
.asset-legend { list-style: none; padding: 0; margin: 0; }
.asset-legend li { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
.chart-key { width: 8px; height: 8px; border-radius: 2px; }
.chart-subhead { margin: 13px 0 5px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 13px; }
.track, .fill { border-radius: 4px; }
.track { height: 6px; overflow: hidden; }
.fill { min-width: 0; background: #6d82a1; }
.fill.gold { background: #776e82; }
.fill.moss { background: #7086a1; }
.overview-events { display: flex; flex-wrap: wrap; gap: 6px; }
.overview-events .badge:hover { filter: brightness(.96); }
.overview-events b { margin-left: 4px; font-size: 14px; }
.queue-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; padding: 7px 0; gap: 8px; border-bottom: 1px solid var(--line); }
.queue-item:last-child { border-bottom: 0; }
.queue-item b { display: block; font-size: 13px; overflow-wrap: anywhere; }
.queue-item small { color: var(--muted); font-size: 11px; }
.case-section { margin-top: 19px; }
.case-grid { gap: 7px; }
.case-card { padding: 12px 15px; }
.case-card h4 { margin: 5px 0 2px; font-size: 15px; font-family: var(--serif); font-weight: 700; }
.case-card p { margin: 0; color: var(--muted); font-size: 12px; }
.case-card .mini-btn { margin-top: 5px; padding: 0; border: 0; color: var(--red); text-align: left; }
.case-card .mini-btn:hover { text-decoration: underline; }

@media (max-width: 540px) {
  .masthead-in { padding-block: 10px 8px; }
  .toolbar { width: 100%; }
  .toolbar-menu-items { right: auto; left: 0; }
  .wb-item:not(.wb-event) > .wb-action { grid-column: 1 / -1; }
  .row-item, .detail-head { flex-wrap: wrap; }
  .panel-head { gap: 7px; }
  .bar-item { grid-template-columns: 78px minmax(0, 1fr) 26px; }
}
@media print {
  .wb-print-owner { display: inline; }
  .case-card { break-inside: avoid; }
  .asset-ring { print-color-adjust: exact; }
}

/* 正文与操作文字共用字号，辅助信息保留可读的最小字号。 */
:root {
  --type-caption: 12px;
  --type-control: 13px;
  --type-body: 14px;
  --type-row: 15px;
  --type-section: clamp(19px, 2.2vw, 22px);
  --type-page: clamp(29px, 4.1vw, 40px);
}
body { font-size: var(--type-body); line-height: 1.65; }
.pagehead h1 { font-size: var(--type-page); }
.panel-head h3 { font-size: var(--type-section); }
.brand-name, .modal h3 { font-size: 21px; }
.sec-title { font-size: 17px; }
.kpi b, .asset-ring b { font-size: 25px; }
.pagehead .sub, .tbl, .input, .select, .field input, .field select, .field textarea,
.event p, .case-card p { font-size: var(--type-body); line-height: 1.55; }
.tab, .mini-btn, .tb-btn, .wb-action .mini-btn, .wb-context label,
.tbl th, .panel-head p, .event p.src, .kpi label, .asset-legend li, .metric .m-line,
.bar-item, .detail-box b, .wb-later summary, .queue-item b { font-size: var(--type-control); }
.tbl th { letter-spacing: .015em; }
.wb-item strong, .row-item b, .event h4, .case-card h4, .tl-item b {
  font-size: var(--type-row); line-height: 1.45; font-weight: 680;
}
.brand-sub, .scope, .tab .n, .badge, .muted, .footer, .row-item small, .wb-item small,
.queue-item small, .kpi small, .kpi b i, .field label, .detail-box small, .event-date,
.asset-ring div, .tl-item small, .hr-chip, .modal .desc, .callout, .bar-item em {
  font-size: var(--type-caption); line-height: 1.55;
}

/* 看板首页：用信息卡片建立快速定位 */
.dashboard-home { display: grid; gap: 16px; }
.wb-context { margin-bottom: 0; padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
.wb-context label { font-size: 13px; }
.wb-overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.wb-shortcut { display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: left; gap: 0 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.wb-shortcut:hover { border-color: #8b9bb0; background: #fafbfc; }
.wb-shortcut span { font-size: 13px; color: var(--ink-2); }
.wb-shortcut b { grid-column: 2; grid-row: 1 / span 2; font-size: 25px; line-height: 1.1; color: var(--red); }
.wb-shortcut small { color: var(--muted); font-size: 12px; }
.wb-section { min-width: 0; }
.wb-section-head { display: flex; align-items: end; justify-content: space-between; gap: 10px; margin: 0 0 8px; }
.wb-section-head h2 { margin: 0; font: 700 20px/1.4 var(--serif); color: var(--ink); }
.wb-section-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.wb-card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.wb-card { min-width: 0; display: flex; flex-direction: column; gap: 5px; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
.wb-card-top { display: flex; align-items: start; justify-content: space-between; gap: 8px; }
.wb-card strong { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.wb-card p { margin: 0; color: var(--ink-2); font-size: 12px; line-height: 1.5; }
.wb-card small { color: var(--muted); font-size: 12px; line-height: 1.5; }
.wb-card-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 5px; }
.wb-search { width: min(100%, 245px); }
.wb-search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line-strong); border-radius: 6px; font: inherit; }
.wb-count { color: var(--muted); font: 12px/1.5 var(--sans); }
@media(max-width: 780px) { .wb-card-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
@media(max-width: 540px) {
 .wb-overview { gap: 6px; }
 .wb-shortcut { padding: 9px; }
 .wb-shortcut b { font-size: 21px; }
 .wb-card-grid { grid-template-columns: 1fr; }
 .wb-section-head { align-items: start; flex-direction: column; }
 .wb-search { width: 100%; }
}

.kpis-home { grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; border: 0; background: transparent; overflow: visible; }
.kpis-home > .kpi { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; }
.grid-2, .grid-3, .dashboard-grid { grid-template-columns: minmax(0,1fr); gap: 10px; }
.wb-overview { grid-template-columns: repeat(3,minmax(0,1fr)); }
.wb-card-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
.wb-section + .wb-section { margin-top: 5px; }
.wb-card { box-shadow: 0 1px 2px #232a3408; }
.wb-card-actions .mini-btn { flex: 1 1 auto; }
@media(max-width:800px) {
 .kpis-home { grid-template-columns: repeat(2,minmax(0,1fr)); }

 .wb-card-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
}
@media(max-width:540px) {
 .wb-card-grid { grid-template-columns: 1fr; }
}


.module-list { display:grid; gap:8px; padding-bottom:25px; }
.module { overflow:hidden; background:#fff; border:1px solid var(--line); border-radius:8px; }
.module-toggle { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:5px 12px; width:100%; padding:13px 16px; border:0; background:#fff; text-align:left; cursor:pointer; }
.module-toggle:hover { background:#faf9f7; }
.module.is-open { border-color:#b8b0c4; box-shadow:0 2px 8px #25212b0c; }
.module.is-open > .module-toggle { background:#faf9f7; }
.module-name { display:flex; align-items:center; gap:9px; font-size:16px; font-weight:700; color:var(--ink); }
.module-subtitle { color:var(--muted); font-size:12px; line-height:1.45; }
.module-chevron { grid-column:2; grid-row:1 / span 2; font-size:18px; color:var(--muted); transform:rotate(0); transition:transform .18s; }
.module.is-open .module-chevron { transform:rotate(180deg); }
.module-badge { display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 6px; border-radius:12px; background:#f2f0ed; color:var(--ink-2); font-size:11px; font-weight:700; }
.module-panel { padding:0 clamp(12px,2vw,20px) 16px; border-top:1px solid var(--line); }
.module-content { padding-top:12px; }
.module-content > .pagehead { display:none; }
@media(max-width:540px) {
 .module-toggle { padding:11px 12px; }
 .module-name { font-size:15px; }
 .module-subtitle { font-size:12px; }
}

.dashboard-home { padding-top: 16px; }
.home-intro { display:flex; justify-content:space-between; align-items:end; gap:16px; padding:8px 0 18px; }
.home-intro h1 { margin:0; font:700 clamp(28px,4vw,38px)/1.25 var(--serif); color:var(--ink); }
.home-intro p { margin:5px 0 0; color:var(--muted); font-size:13px; }
.owner-select { display:flex; align-items:center; gap:8px; white-space:nowrap; }
.owner-select label { font-size:13px; font-weight:650; color:var(--ink-2); }
.home-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:18px; }
.home-stat { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 15px; border:1px solid var(--line); border-radius:8px; background:#fff; }
.home-stat span { font-size:13px; color:var(--ink-2); }
.home-stat b { font-size:23px; color:var(--red); }
.feature-heading { display:flex; align-items:center; gap:8px; margin:0 0 9px; font-size:17px; font-weight:720; color:var(--ink); }
.feature-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
.feature-card {
 display:flex; flex-direction:column; min-height:112px; padding:12px; text-align:left;
 border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);
 transition:border-color .15s, transform .15s, box-shadow .15s;
}
.feature-card:hover { border-color:#9daabd; transform:translateY(-1px); box-shadow:0 4px 12px #27374a0e; }
.feature-card-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.feature-icon { display:grid; place-items:center; width:28px; height:28px; border-radius:7px; background:#edf1f5; color:#344c6e; font-weight:750; }
.feature-count { font-size:20px; color:var(--red); font-weight:700; }
.feature-card strong { margin-top:8px; font-size:14px; line-height:1.4; }
.feature-card small { margin-top:2px; color:var(--muted); font-size:12px; line-height:1.45; }
.feature-modal { position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:18px; background:#202a3875; }
.feature-window { display:flex; flex-direction:column; width:min(1080px,100%); height:min(88vh,880px); overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--paper); box-shadow:0 18px 60px #202a3840; }
.feature-window-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 17px; border-bottom:1px solid var(--line); background:#fff; flex:none; }
.feature-window-head strong { font:700 18px/1.3 var(--serif); }
.feature-window-body { overflow:auto; padding:14px 18px 24px; }
.feature-window-body .pagehead { display:none; }
.feature-window-body .panel { background:#fff; }
.feature-close { width:32px; height:32px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink-2); font-size:19px; }
.feature-close:hover { background:#f1f0ed; }
@media(max-width:800px) {
 .feature-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
 .feature-window { height:94vh; }
}
@media(max-width:540px) {
 .home-intro { align-items:start; flex-direction:column; }
 .owner-select { width:100%; }
 .owner-select select { flex:1; }
 .home-stats { gap:6px; }
 .home-stat { align-items:start; flex-direction:column; gap:2px; padding:9px; }
 .home-stat span { font-size:12px; }
 .home-stat b { font-size:20px; }
 .feature-grid { gap:6px; }
 .feature-card { min-height:104px; padding:9px; }
 .feature-window { height:96vh; border-radius:8px; }
 .feature-window-body { padding:10px; }
}
:root{--paper:#f4f3f0;--wash:#eaeef3;--roster-blue:#334d69}
.wrap { max-width:1240px; padding-inline:clamp(14px,3vw,38px); }
.masthead { border-top:3px solid #2e435b; }
.brand-name { font-size:20px; }
.roster-hero { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:23px 0 18px; }
.roster-hero h1 { font:700 clamp(27px,3.2vw,36px)/1.25 var(--serif); margin:0; color:#26394b; }
.roster-hero p { margin:4px 0 0; font-size:12px; color:var(--muted); }
.roster-hero .select { background:#fff; }
.roster-sheet { background:white; border:1px solid #dcdcd9; border-radius:10px; overflow:hidden; }
.roster-controls,.roster-foot { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 18px; }
.roster-filters { display:flex; flex-wrap:wrap; gap:5px; }
.roster-filters button { padding:6px 10px; border:1px solid transparent; background:transparent; border-radius:5px; font-size:13px; color:#44515e; }
.roster-filters button b { margin-left:4px; font-variant-numeric:tabular-nums; }
.roster-filters button[aria-pressed="true"] { color:white; background:var(--roster-blue); }
.roster-filters button:hover:not([aria-pressed="true"]) { background:var(--wash); }
#rosterSearch { max-width:100%; padding:7px 10px; font-size:13px; border:1px solid #d6d9da; border-radius:5px; background:#fcfcfb; }
.roster-cols,.person-line { display:grid; align-items:center; gap:14px; grid-template-columns:minmax(135px,1.35fr) minmax(116px,.87fr) minmax(140px,1.5fr) 88px 73px; padding-inline:18px; }
.roster-cols { background:#eff1f1; padding-block:7px; font-size:12px; color:#515d67; font-weight:650; border-block:1px solid #e3e5e3; }
.person-line { min-height:58px; padding-block:7px; }
.person-block+.person-block { border-top:1px solid #e9e9e5; }
.person-block:hover { background:#fbfbfa; }
.person-link { background:none; color:#24394f; padding:0; border:none; font-size:15px; font-weight:750; }
.person-link:hover { text-decoration:underline; }
.caret { font-family:var(--sans); color:#8a98a6; font-size:12px; margin-right:5px; }
.who small { display:block; margin-left:12px; color:#616a72; font-size:12px; overflow-wrap:anywhere; }
.signals { display:flex; flex-wrap:wrap; gap:4px; }
.signal { padding:1px 6px; border-radius:4px; color:#525b65; background:#f0f1f1; font-size:12px; }
.signal.over { background:#f9e8e5; color:#8c392b; }
.signal.due { background:#faf0df; color:#815515; }
.signal.verify { background:#eaf0f8; color:#3c587e; }
.next-step { color:#2f3740; font-size:14px; line-height:1.4; overflow-wrap:anywhere; }
.due-date { color:#475667; font-size:13px; font-variant-numeric:tabular-nums; }
.roster-act { border:1px solid #c9d2dc; background:white; color:#334e6c; font-size:12px; border-radius:5px; padding:4px 8px; }
.roster-act:hover { background:#eff3f7; }
.roster-foot { border-top:1px solid var(--line); color:var(--muted); font-size:12px; padding-block:8px; }
.roster-empty { padding:20px; text-align:center; color:var(--muted); }
.person-more { margin:0 12px 10px; padding:10px 12px; border:1px solid #e1e6eb; border-radius:5px; background:#f5f7f9; }
.more-head,.more-line { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:13px; color:var(--ink-2); }
.more-head { justify-content:space-between; }
.more-head button+button { margin-left:4px; }
.more-line { margin-top:7px; border-top:1px solid #e0e5e8; padding-top:6px; }
.more-line span { flex:1; }
.more-line b { font-size:12px; }
.module-bar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px; padding:18px 0 14px; }
.module-bar h1 { margin:0; font:700 27px/1.35 var(--serif); }
.footer { margin-top:14px; padding:9px 0 12px; }
@media(max-width:750px){
 .roster-controls { align-items:stretch; flex-direction:column; gap:6px; padding:8px 12px; }
 .roster-cols { display:none; }
 .person-line { grid-template-columns:minmax(0,1fr) auto; gap:4px 8px; padding:9px 12px; }
 .who { grid-column:1; } .signals { grid-column:2; justify-content:end; }
 .next-step { grid-column:1; } .next-step:before { content:"下一步 · "; color:var(--muted); font-size:12px; }
 .person-act { grid-column:2;grid-row:2 / span 2; }
 .due-date { grid-column:1; } .due-date:before { content:"截止 "; }
 .roster-hero { flex-wrap:wrap; padding:13px 0; }
 .masthead-in { gap:6px; }
}

.row-tier { font-size: 11px; color:#626d78; margin-left:6px; white-space:nowrap; }

/* 品牌页头。标识取自海底捞国际控股有限公司 2024-04-25 股东通函。 */
.masthead { background:#fff; border-top:4px solid #c41930; border-bottom:1px solid #dcdde0; }
.masthead-in { min-height:146px; padding-block:30px; gap:18px 28px; }
.brand { display:flex; align-items:center; gap:clamp(17px,2.5vw,36px); min-width:0; }
.hdl-logo { display:block; width:clamp(96px,10.8vw,146px); height:auto; flex:none; }
.brand-lockup { border-left:1px solid #d9d9d9; padding-left:clamp(17px,2.3vw,32px); }
.brand-name { font:700 clamp(30px,3.1vw,43px)/1.23 var(--serif); color:#243448; letter-spacing:.06em; }
.brand-sub { margin-top:7px; font-size:13px; line-height:1.5; color:#536171; }
.editor-mode #app>main, .editor-mode #app>.footer, .editor-mode .masthead .toolbar { display:none; }
.editor-page.show { display:block; position:static; width:min(832px,100%); margin:0 auto; padding:22px clamp(14px,3vw,30px) 42px; background:none; overflow:visible; }
.editor-back { display:inline-flex; gap:8px; align-items:center; padding:5px 0; margin-bottom:12px; background:none; border:0; color:#425873; font-size:14px; }
.editor-back::before { content:'←'; }
.editor-back:hover { text-decoration:underline; }
.editor-page .modal { width:100%; max-width:none; max-height:none; overflow:visible; padding:clamp(20px,3vw,34px); background:white; border:1px solid #dadddf; border-radius:12px; }
.editor-page h3 { font:700 26px/1.35 var(--serif); margin:0 0 6px; }
.editor-page .desc { max-width:60ch; margin:0 0 23px; font-size:14px; }
.editor-page .form-grid { gap:16px 20px; }
.editor-page .field[hidden] { display:none; }
.editor-page .field label { font-size:14px; font-weight:600; color:#374659; }
.editor-page :is(input,select,textarea) { background:#fbfbfa; font-size:15px; line-height:1.5; }
.editor-page .modal-foot { border-top:1px solid #e5e5e3; padding-top:16px; }
@media(max-width:780px) {
  .masthead-in { min-height:0; padding-block:22px 14px; gap:17px; }
  .masthead-in .toolbar { flex-basis:100%; }
  .brand-name { font-size:32px; }
  .brand-sub { font-size:12px; }
}
@media(max-width:540px) {
  .brand { gap:14px; }
  .brand-lockup { padding-left:14px; }
  .hdl-logo { width:84px; }
  .brand-name { font-size:29px; }
  .editor-page .form-grid { grid-template-columns:1fr; }
}

/* 各层页面在相同位置提供返回。 */
.return-button {
  background:#fff; color:#304861; border:1px solid #bcc8d3; border-radius:6px;
  display:inline-flex; align-items:center; gap:7px; min-height:38px; margin:0;
  padding:6px 12px; font:600 14px/1.4 var(--sans); cursor:pointer; text-align:left;
}
.return-button::before { content:"←"; flex:none; }
.return-button:hover { border-color:#617c97; background:#f3f6f8; text-decoration:none; }
.module-bar,.editor-nav,.detail-nav { position:sticky; top:0; z-index:5; }
.module-bar { justify-content:flex-start; padding-block:9px; column-gap:16px; border-bottom:1px solid var(--line); margin:0 0 12px; background:var(--paper); }
.module-bar h1 { font-size:clamp(18px,2.3vw,27px); }
.module-bar .home-link { margin-left:auto; font-size:13px; }
.editor-nav { background:var(--paper); padding:6px 0; margin:0 0 8px; }
.editor-page.show { padding-top:8px; }
.detail-nav { padding:10px 0; margin:0 0 8px; background:#fff; border-bottom:1px solid var(--line); }
#detailModal .modal { overscroll-behavior:contain; padding-top:0; background:#fff; }
body.detail-open { overflow:hidden; }
@media(max-width:620px) {
  .module-bar { gap:7px; }
  .module-bar .return-button { font-size:13px; padding-inline:8px; }
  .module-bar h1 { font-size:17px; }
  .module-bar .home-link { padding:5px; }
  .return-button { min-height:42px; }
}
.handoff-panel,.staff-panel { padding:0; background:#fff; border:1px solid #d9dfe3; border-radius:11px; }
.handoff-panel { scroll-margin-top:70px; }
.handoff-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 16px; padding:16px 20px; }
.handoff-head h2 { margin:0; font:700 22px/1.4 var(--serif); color:#26394c; }
.handoff-head h2 small { font:500 13px var(--sans); color:#5d6d79; margin-left:5px; }
.pool-tabs { display:flex; gap:2px; background:#edf0f3; border-radius:7px; padding:3px; }

#actionDialog { width:min(448px,calc(100vw - 28px)); max-height:min(85vh,760px); box-sizing:border-box; padding:0; color:#28394a; background:#fff; border:1px solid #d6dde3; border-radius:14px; box-shadow:0 18px 75px #14263533; }

        person: person.name, due: due, priority: "中", done: false, doneAt: "", note: ""

    }

  function assetChart(total) {
    var tiers = new Map([
      ["重点储备", { value: 0, color: "#435c7b" }],
      ["潜力储备", { value: 0, color: "#8299b5" }],
      ["长期观察", { value: 0, color: "#a6b2c2" }],
      ["待评估", { value: 0, color: "#cfb79f" }]
    ]);
    var other = { value: 0, color: "#d5d1dc" };
    S.talents.forEach(function (person) {
      if (!person.archived) (tiers.get(person.tier) || other).value++;
    });
    if (other.value) tiers.set("其他", other);

    var stops = [];
    var running = 0;
    var legend = Array.from(tiers, function (entry) {
      var name = entry[0], tier = entry[1];
      if (tier.value) {
        var start = running / total * 100;
        running += tier.value;
        stops.push(tier.color + ' ' + start + '% ' + (running / total * 100) + '%');
      }
      return '<li><span class="chart-key" style="background:' + tier.color + '"></span>' + name + '<b>' + tier.value + '</b></li>';
    }).join("");
    var style = stops.length ? ' style="background:conic-gradient(' + stops.join(', ') + ')"' : '';
    return '<div class="asset-chart"><div class="asset-ring"' + style + '><div><b>' + total +
      '</b>有效档案</div></div><div class="asset-breakdown"><ul class="asset-legend" aria-label="储备层级人数">' + legend + '</ul></div></div>';
  }

      if (!q) return true;
      return (t.name + t.company + t.role + t.industry + (t.owner || "")).toLowerCase().indexOf(q) >= 0;
    });
    return list.map(function (t) {
      var li = lastInteract(t.id);
      return "<tr><td><span class=\"person-name\">" + esc(t.name) + '</span><div class="muted">ID · ' + t.id + "</div></td>" +

  function taskListRow(task, date) {
    var name = task.name || "未命名任务";
    var due = task.due || "";
    var timing = !task.done && due ? (due < date ? "逾期" : due === date ? "今天" : "") : "";
    var shortDate = isDate(due) && due.slice(0,4) === date.slice(0,4) ? Number(due.slice(5,7)) + "月" + Number(due.slice(8,10)) + "日" : due;
    var priority = task.priority || "中";
    var tone = priority === "高" ? "high" : priority === "低" ? "low" : "normal";
    var buttonLabel = (task.done ? "重新打开" : "标记完成") + "：" + name;
    return '<li class="maintenance-row' + (task.done ? ' finished' : '') + '">' +
      '<button type="button" class="task-toggle" data-act="toggle-task" data-id="' + task.id + '" aria-pressed="' + !!task.done +

  function chooseAction(config) {
    var dialog = document.getElementById("actionDialog");
    var form = dialog.querySelector("form");
    var submit = form.querySelector("[type=submit]");
    var cancel = form.querySelector("[data-cancel]");
    var error = form.querySelector("[role=alert]");
    document.getElementById("actionTitle").textContent = config.title;
    document.getElementById("actionDesc").textContent = config.description || "";
    document.getElementById("actionFields").innerHTML = config.fields || "";
    submit.textContent = config.submit;
    submit.classList.toggle("danger", Boolean(config.danger));
    cancel.hidden = Boolean(config.notice);
    error.textContent = "";
    return new Promise(function (resolve) {
      var result = null;
      function validate() {
        var value = new FormData(form).get("choice");
        var issue = config.validate ? config.validate(value) : "";
        error.textContent = issue || "";
        return issue ? null : { value:value };
      }
      form.onsubmit = function (e) {
        e.preventDefault();
        result = validate();
        if (result) dialog.close();
      };
      cancel.onclick = function () { dialog.close(); };
      dialog.onclose = function () {
        form.onsubmit = cancel.onclick = dialog.onclose = null;
        document.getElementById("actionFields").replaceChildren();
        resolve(result);
      };
      dialog.showModal();
      var focusTarget = form.querySelector('input[type=text], input:checked, input[type=radio]') || (config.danger ? cancel : submit);
      focusTarget.focus({preventScroll:true});
    });
  }
  function ask(title, description, submit) {
    return chooseAction({ title:title, description:description, submit:submit, danger:true });
  }
  function changeOwner(person, name) {
    if (person.owner === name) return;

  async function assignOwner(id) {
    var person = byId(id);

    var choices = activeMembers().map(function (member) {

    }).join("") + '</fieldset>';

  async function disableMember(id) {
    var member = activeMembers().find(function (m) { return m.id === Number(id); });
    if (!member) return;
    var owned = ownedBy(member.name);
    var description = owned.length ? "确认后，" + member.name + "名下的 " + owned.length + " 位在库人选将进入待分配队列。原有待办和沟通记录随人选保留。" : member.name + "目前没有需要交接的在库人选。";
    if (!await ask("停用" + member.name + "？", description, owned.length ? "停用并交接" : "停用成员")) return;
    var wasCurrent = currentOwner() === member.name;
    member.active = false;
    owned.forEach(function (person) { changeOwner(person, UNASSIGNED); });

    toast(owned.length ? owned.length + " 位人选已进入待分配队列" : "成员已停用");

  var app = document.getElementById("app");

  function myRoster() {
    var owner = currentOwner(), date = today();
    var people = S.talents.filter(function (p) { return !p.archived && (!owner || p.owner === owner); });
    var rows = people.map(function (p) {
      return { person: p, tasks: [], events: [], overdue: false, due: false, gaps: [] };
    });
    var byPerson = new Map(rows.map(function (r) { return [r.person.id, r]; }));
    S.tasks.forEach(function (t) {
      if (t.done) return;
      var row = byPerson.get((taskTalent(t) || {}).id);
      if (row) row.tasks.push(t);
    });
    S.events.forEach(function (e) {
      var row = byPerson.get(e.talentId);
      if (row && e.status === "pending") row.events.push(e);
    });
    rows.forEach(function (r) {
      r.tasks.sort(function (a,b) { return (a.due || "9999").localeCompare(b.due || "9999") || a.id-b.id; });
      r.events.sort(function (a,b) { return (b.found || "").localeCompare(a.found || ""); });
      var due = r.tasks[0] && r.tasks[0].due;
      r.overdue = Boolean(due && due < date);
      r.due = Boolean(due && due <= date);
      [["company","公司"],["role","岗位"]].forEach(function (k) {
        if (!r.person[k[0]] || ["待补充","待确认"].includes(r.person[k[0]])) r.gaps.push(k[1]);
      });
    });
    return rows.sort(function (a,b) {
      return ((a.tasks[0] || {}).due || "9999").localeCompare((b.tasks[0] || {}).due || "9999") ||
        b.events.length - a.events.length || a.person.id - b.person.id;
    });
  }
  function actionBtn(action, id, title, cls) {
    return '<button type="button" class="' + (cls || "mini-btn") + '" data-act="' + action +
      '" data-id="' + Number(id) + '">' + esc(title) + '</button>';
  }
  function rowStatus(r) {
    var labels = [];
    if (r.due) labels.push('<span class="signal ' + (r.overdue ? 'over' : 'due') + '">' + (r.overdue ? '已逾期' : '今天到期') + '</span>');
    if (r.events.length) labels.push('<span class="signal verify">待核实</span>');
    if (r.gaps.length) labels.push('<span class="signal">待补资料</span>');
    if (!labels.length) labels.push('<span class="signal">' + (r.tasks.length ? '已排待办' : '未排待办') + '</span>');
    return labels.join("");
  }

    var data = { talentId: tid, date: date, channel: val("iChannel"), owner: val("iOwner"), note: val("iNote") };
    if (editing.inter) {
      var i = S.interactions.find(function (x) { return x.id === editing.inter; });
      Object.keys(data).forEach(function (k) { i[k] = data[k]; });
      audit("编辑互动记录：" + (byId(tid) || {}).name, data.date + " · " + data.channel);
      toast("互动记录已更新");
    } else {
      data.id = ++S.nextId;
      S.interactions.unshift(data);
      audit("记录互动：" + (byId(tid) || {}).name, data.date + " · " + data.channel);
      var followup = S.tasks.find(function (task) { return task.id === editing.followup; });
      if (followup && !followup.done && followup.talentId === tid) {
        followup.done = true; followup.doneAt = date;
        audit("完成任务：" + followup.name, date);
      }
      if (due) scheduleFollowup(person, due);
      toast(due ? "互动已记录，下次联系已加入待办" : "互动已记录");
    }
    save(); hide("interModal"); render();
  }
  async function delInter(id) {
    if (!await ask("删除这条互动记录？","删除后无法在看板中恢复。","确认删除")) return;
    var i = S.interactions.find(function (x) { return x.id === Number(id); });
    S.interactions = S.interactions.filter(function (x) { return x.id !== Number(id); });
    audit("删除互动记录：" + (i ? (byId(i.talentId) || {}).name : ""), "");
    save(); render(); toast("互动记录已删除");
    if (document.getElementById("detailModal").classList.contains("show")) openDetail(editing.detail);
  }

  /* ---------- 履历段 ---------- */
  function openCareer(tid, idx) {
    editing.career = { tid: Number(tid), idx: idx == null ? -1 : Number(idx) };
    var t = byId(tid);
    var c = editing.career.idx >= 0 ? t.career[editing.career.idx] : null;
    document.getElementById("careerModalTitle").textContent = c ? "编辑履历段" : "追加履历段";
    setVal("cCompany", c ? c.company : ""); setVal("cRole", c ? c.role : ""); setVal("cPeriod", c ? c.period : "");
    show("careerModal");
  }
  function saveCareer() {
    var t = byId(editing.career.tid);
    if (!t) return;
    var c = { company: val("cCompany") || "待补充", role: val("cRole") || "待补充", period: val("cPeriod") || "时间待补充" };
    if (editing.career.idx >= 0) {
      t.career[editing.career.idx] = c;
      audit("编辑履历段：" + t.name, c.company + " · " + c.role + " · " + c.period);
    } else {
      t.career.push(c);
      audit("追加履历段：" + t.name, c.company + " · " + c.role + " · " + c.period);
    }
    save(); hide("careerModal"); render(); toast("履历已保存");
  }
  async function delCareer(tid, idx) {
    if (!await ask("删除这条履历段？","删除后无法在看板中恢复。","确认删除")) return;
    var t = byId(tid);
    var c = t.career.splice(Number(idx), 1)[0];
    audit("删除履历段：" + t.name, c.company + " · " + c.role);
    save(); render(); openDetail(t.id); toast("履历段已删除");
  }

  /* ---------- 人才详情 ---------- */
  function openDetail(id) {
    var t = byId(id);
    if (!t) return;
    editing.detail = t.id;
    var evs = S.events.filter(function (e) { return e.talentId === t.id; });
    var inters = S.interactions.filter(function (i) { return i.talentId === t.id; }).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
    var h = '<div class="detail-head"><div class="avatar">' + esc(t.name[0]) + "</div><div>" +
      '<h3 id="personDetailName">' + esc(t.name) + "</h3><p>" + esc(t.company) + " · " + esc(t.role) + "</p>" + tierBadge(t.tier) + "</div>" +
      '<div class="row-actions no-print" style="margin-left:auto">' +
      '<button class="mini-btn" data-act="edit-talent" data-id="' + t.id + '">编辑档案</button>' +
      '<button class="mini-btn" data-act="del-talent" data-id="' + t.id + '">归档</button></div></div>' +
      '<div class="detail-grid">' +
      '<div class="detail-box"><small>所属行业</small><b>' + esc(t.industry) + "</b></div>" +
      '<div class="detail-box"><small>关系负责人</small><b>' + esc(t.owner || "待分配") + "</b></div>" +
      '<div class="detail-box"><small>最近核实</small><b>' + esc(t.verified || "待核实") + "</b></div>" +
      '<div class="detail-box"><small>职业经历段数</small><b>' + t.career.length + "</b></div></div>" +
      (t.note ? '<div class="callout">' + esc(t.note) + "</div>" : "");
    h += '<div class="sec-title"><span>职业时间线</span><button class="mini-btn no-print" data-act="career-add" data-id="' + t.id + '">＋ 追加履历段</button></div><div class="timeline">' +
      (t.career.slice().reverse().map(function (c, ri) {
        var idx = t.career.length - 1 - ri;
        return '<div class="tl-item"><b>' + esc(c.company) + " · " + esc(c.role) + "</b><small>" + esc(c.period) + "</small>" +
          '<div class="row-actions no-print"><button class="mini-btn" data-act="career-edit" data-id="' + t.id + ":" + idx + '">编辑</button>' +
          '<button class="mini-btn" data-act="career-del" data-id="' + t.id + ":" + idx + '">删除</button></div></div>';
      }).join("") || '<div class="empty">暂无履历，点击右上追加</div>') + "</div>";
    h += '<div class="sec-title"><span>互动记录</span><button class="mini-btn no-print" data-act="add-inter" data-id="' + t.id + '">＋ 记录互动</button></div>' +
      (inters.map(function (i) {
        return '<div class="row-item"><div><b>' + esc(i.channel) + "</b><small>" + esc(i.date) + " · " + esc(i.owner || "未记录") + (i.note ? "<br>" + esc(i.note) : "") + "</small></div>" +
          '<div class="row-actions no-print"><button class="mini-btn" data-act="edit-inter" data-id="' + i.id + '">编辑</button>' +
          '<button class="mini-btn" data-act="del-inter" data-id="' + i.id + '">删除</button></div></div>';
      }).join("") || '<div class="empty">暂无互动记录</div>');
    h += '<div class="sec-title"><span>相关人才事件</span><button class="mini-btn no-print" data-act="add-event" data-id="' + t.id + '">＋ 记录新事件</button></div>' +
      (evs.map(function (e) {
        return '<div class="row-item"><div><b>' + esc(e.type) + " · " + esc(e.company) + "</b><small>" + esc(e.found) + " · " + esc(e.source) + "</small></div>" + statusBadge(e.status) + "</div>";
      }).join("") || '<div class="empty">暂无事件</div>');
    document.getElementById("detailContent").innerHTML = h;
    show("detailModal");
  }

  /* ---------- 导出 / 导入 ---------- */
  function download(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  function exportJSON() {
    download(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }), "高招人才池数据.json");
  }
  function exportHTML() {
    var clone = document.documentElement.cloneNode(true);
    clone.querySelector("#embedded-data").textContent = JSON.stringify(S).replace(/<\//g, "<\\/");
    clone.querySelector("#app").innerHTML = "";
    clone.querySelectorAll(".modal-back").forEach(function (m) { m.classList.remove("show"); });
    download(new Blob(["<!DOCTYPE html>\n" + clone.outerHTML], { type: "text/html;charset=utf-8" }), "高招人才池看板.html");
  }
  function importJSON(file) {
    var reader = new FileReader();
    reader.onload = async function () {
      var data;
      try { data = prepare(JSON.parse(reader.result)); }
      catch (error) {
        chooseAction({title:"无法导入数据", description:"请使用人才池导出的 JSON 文件。当前数据已保留。", submit:"知道了", notice:true}); return;
      }
      if (!await ask("导入人才池备份？","将用备份中的 " + data.talents.length + " 位人才和关联记录替换当前浏览器的数据。","确认导入")) return;
      S = data; expandedPerson = null; rosterSearch = ""; rosterFilter = "all"; rosterPage = 0;
      focusedEvent = null; previousPages = []; tab = "dashboard";
      f = {q:"", ind:"", tier:"", evStatus:"all", evType:"all", task:"undone"};
      audit("导入数据", data.talents.length + " 位人才 · " + data.events.length + " 条事件");
      save(); render(); window.scrollTo(0,0); toast("数据已导入");
    };
    reader.onerror = function () { toast("文件读取失败，请重新选择备份文件。"); };
    reader.readAsText(file, "utf-8");
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", async function (e) {
    var insideMore = e.target.closest(".task-more");
    document.querySelectorAll(".task-more[open]").forEach(function (menu) {
      if (menu !== insideMore || e.target.closest(".task-options button")) menu.open = false;
    });
    var tabBtn = e.target.closest("[data-tab]");
    if (tabBtn) {
      openModule(tabBtn.getAttribute("data-tab"));
      return;
    }
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var menu = el.closest(".toolbar-menu");
    if (menu) menu.open = false;
    var act = el.getAttribute("data-act");
    var id = el.getAttribute("data-id");
    if (act === "nav-back") returnToPage(false);
    else if (act === "nav-home") returnToPage(true);
    else if (act === "roster-filter") {
      rosterFilter = id; rosterPage = 0; expandedPerson = null; render();
      var active = document.querySelector('.roster-filters button[aria-pressed="true"]');
      if (active) active.focus({preventScroll:true});
    }
    else if (act === "roster-page") {
      rosterPage += Number(id); expandedPerson = null; render();
    }
    else if (act === "expand-person") {
      expandedPerson = expandedPerson === Number(id) ? null : Number(id);
      render();
      var current = document.querySelector('.person-link[data-id="' + Number(id) + '"]');
      if (current) current.focus({preventScroll:true});
    }
    else if (act === "person-task") {
      openTask(null, Number(id));
    }
    else if (act === "toggle-demo") {
      if (workCopy) {
        S = workCopy;
        workCopy = null;
      } else {
        workCopy = S;
        S = deep(SEED);
      }
      f = { q: "", ind: "", tier: "", evStatus: "all", evType: "all", task: "undone" };
      previousPages = [];
      focusedEvent = null; tab = "dashboard"; render(); window.scrollTo(0, 0);
    }
    else if (act === "dashboard-talents") {
      if (id === "key") openModule("talents", {q:"", ind:"", tier:"重点储备"});
      else { selectRosterOwner(""); openModule("workbench"); }
    }
    else if (act === "dashboard-tasks") {
      openModule("relations", {task:"undone"});
    }
    else if (act === "review-one") {
      openModule("events", {evStatus:"all", evType:"all"}, Number(id));
    }
    else if (act === "record-followup") {
      var task = S.tasks.find(function (item) { return item.id === Number(id); });
      if (task && !task.done && taskTalent(task)) openInter(taskTalent(task).id, null, task.id);
    }
    else if (act === "filter-events") {
      openModule("events", {evStatus:id, evType:"all"});
    }
    else if (act === "add-member") addMember();
    else if (act === "disable-member") disableMember(id);
    else if (act === "enable-member") enableMember(id);
    else if (act === "assign-owner") assignOwner(id);
    else if (act === "team-filter") { f.teamPool = id; render(); }
    else if (act === "leave-pending") {
      var previousOwner = lastOwnerView && (!lastOwnerView.name || activeMembers().some(function (m) { return m.name === lastOwnerView.name; })) ? lastOwnerView : null;
      if (!activeMembers().length) { openModule("team"); return; }
      selectRosterOwner(previousOwner ? previousOwner.name : activeMembers()[0].name);
      if (previousOwner) {
        rosterFilter = previousOwner.filter; rosterSearch = previousOwner.search;
        rosterPage = previousOwner.page; expandedPerson = previousOwner.expanded;
      }
      render();
    }
    else if (act === "open-pending") { selectRosterOwner(UNASSIGNED); render(); }

    else if (act === "add-talent") openTalent();
    else if (act === "edit-talent") openTalent(Number(id));
    else if (act === "del-talent") delTalent(Number(id));
    else if (act === "detail") openDetail(Number(id));
    else if (act === "add-event") openEvent(id ? Number(id) : null);
    else if (act === "edit-event") openEvent(null, Number(id));
    else if (act === "confirm-event") confirmEvent(id);
    else if (act === "reject-event") rejectEvent(id);
    else if (act === "del-event") delEvent(id);
    else if (act === "add-task") openTask();
    else if (act === "edit-task") openTask(Number(id));
    else if (act === "task-filter") {
      f.task = id;
      render();
      document.querySelector('.task-filters [aria-pressed="true"]').focus({preventScroll:true});
    }
    else if (act === "toggle-task") {
      var listRow = el.closest(".maintenance-row");
      var next = listRow && (listRow.nextElementSibling || listRow.previousElementSibling);
      var neighbor = next && next.querySelector(".task-toggle").dataset.id;
      toggleTask(id);
      if (listRow) {
        var focus = document.querySelector('.task-toggle[data-id="' + Number(id) + '"]') ||
          document.querySelector('.task-toggle[data-id="' + Number(neighbor) + '"]') || document.querySelector('.task-filters [aria-pressed="true"]');
        if (focus) focus.focus({preventScroll:true});
      }
    }
    else if (act === "del-task") delTask(id);
    else if (act === "add-inter") openInter(id ? Number(id) : null);
    else if (act === "edit-inter") openInter(null, Number(id));
    else if (act === "del-inter") delInter(id);
    else if (act === "career-add") openCareer(Number(id));
    else if (act === "career-edit") { var p = id.split(":"); openCareer(p[0], p[1]); }
    else if (act === "career-del") { var p2 = id.split(":"); delCareer(p2[0], p2[1]); }
    else if (act === "save-talent") saveTalent();
    else if (act === "save-event") saveEvent();
    else if (act === "save-task") saveTask();
    else if (act === "save-inter") saveInter();
    else if (act === "save-career") saveCareer();
    else if (act === "close-modal") hide(id);
    else if (act === "print") window.print();
    else if (act === "export-html") exportHTML();
    else if (act === "export-json") exportJSON();
    else if (act === "import-json") document.getElementById("import-file").click();
    else if (act === "reset") {
      var message = workCopy ? "恢复演示初始样例？本次演示的修改将被清除。"
        : "恢复初始样例数据？当前浏览器中的修改将被清除，请先导出 JSON 备份。";
      if (await ask("恢复初始样例？",message,"恢复样例")) {
        S = deep(SEED); save(); render(); toast("已恢复初始样例");
      }
    }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "rosterSearch") {
      rosterSearch = e.target.value; rosterPage = 0; expandedPerson = null;
      document.getElementById("rosterRows").innerHTML = rosterPanel(myRoster());
    }
    if (e.target.id === "talentSearch") {
      f.q = e.target.value;
      var body = document.getElementById("talentRows");
      if (body) body.innerHTML = talentRows();
    }
  });
  document.addEventListener("change", function (e) {
    var id = e.target.id;
    if (id === "rosterOwner") {
      selectRosterOwner(e.target.value);
      render(); document.getElementById("rosterOwner").focus();
    }
    else if (id === "industryFilter") { f.ind = e.target.value; render(); }
    else if (id === "tierFilter") { f.tier = e.target.value; render(); }
    else if (id === "eventFilter") { focusedEvent = null; f.evStatus = e.target.value; render(); }
    else if (id === "eventTypeFilter") { focusedEvent = null; f.evType = e.target.value; render(); }
    else if (id === "import-file" && e.target.files && e.target.files[0]) { importJSON(e.target.files[0]); e.target.value = ""; }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("actionDialog").open) {
      var taskMenu = document.querySelector(".task-more[open]");
      if (taskMenu) { taskMenu.open = false; taskMenu.querySelector("summary").focus({preventScroll:true}); return; }
      var active = document.querySelector(".modal-back.show");
      if (active) hide(active.id);
    }
  });

  /* ---------- 启动 ---------- */
  render();
})();</script>
</body>
</html>
